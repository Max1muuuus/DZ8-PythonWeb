<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7f2">
    <title>{% block title %}Мій особистий кабінет{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Segoe UI", sans-serif;
            color: #23332d;
            background: #f5f7f2;
            --page: #f5f7f2;
            --surface: #fff;
            --text: #23332d;
            --muted: #708078;
            --border: #e6ebe4;
            --accent: #345b43;
            --accent-hover: #284a35;
            --soft: #fcfdfb;
        }

        :root.dark-theme {
            color-scheme: dark;
            color: #ecf2ed;
            background: #17211b;
            --page: #17211b;
            --surface: #202d25;
            --text: #ecf2ed;
            --muted: #a7b7ab;
            --border: #34443a;
            --accent: #9ac5a5;
            --accent-hover: #b6d8be;
            --soft: #25332a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            background:
                radial-gradient(ellipse at 10% 5%, #e0eee2 0, transparent 34%),
                var(--page);
            color: var(--text);
        }

        .dark-theme body {
            background:
                radial-gradient(ellipse at 10% 5%, #283d2f 0, transparent 34%),
                var(--page);
        }

        .shell {
            width: min(100%, 720px);
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 32px;
        }

        .brand {
            color: var(--text);
            font-size: 1.05rem;
            font-weight: 750;
            text-decoration: none;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        nav a {
            padding: 9px 12px;
            border-radius: 10px;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
        }

        nav a:hover,
        nav a[aria-current="page"] {
            background: var(--surface);
            color: var(--accent);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 7vw, 3.2rem);
            letter-spacing: -0.06em;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 1.05rem;
        }

        .intro {
            margin: 12px 0 28px;
            color: var(--muted);
            line-height: 1.6;
        }

        .card {
            padding: clamp(20px, 5vw, 32px);
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: 0 18px 50px #2943310d;
        }

        .stack {
            display: grid;
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 650;
        }

        input,
        select {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: var(--surface);
            color: var(--text);
            font: inherit;
        }

        input:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
        }

        button,
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 16px;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 650;
            text-decoration: none;
            transition: background 150ms ease, transform 150ms ease;
        }

        .dark-theme button,
        .dark-theme .button {
            color: #17211b;
        }

        button:hover,
        .button:hover {
            transform: translateY(-1px);
            background: var(--accent-hover);
        }

        .button-secondary {
            border: 1px solid var(--border);
            background: var(--soft);
            color: var(--text);
        }

        .dark-theme .button-secondary {
            color: var(--text);
        }

        .button-danger {
            background: #f5eeeb;
            color: #8a5142;
        }

        .dark-theme .button-danger {
            background: #49312d;
            color: #ffd5c8;
        }

        .button-danger:hover {
            background: #f0e2dd;
        }

        .dark-theme .button-danger:hover {
            background: #5a3b35;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        .muted {
            color: var(--muted);
            line-height: 1.6;
        }

        .error {
            margin: 10px 0 0;
            color: #b23d30;
            font-size: 0.92rem;
        }

        .dark-theme .error {
            color: #ff9a8b;
        }

        .task-list {
            display: grid;
            gap: 10px;
            margin: 22px 0 0;
            padding: 0;
            list-style: none;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--soft);
        }

        .task-name {
            overflow-wrap: anywhere;
        }

        .count {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .setting-row + .setting-row {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .setting-row .muted {
            margin: 0 0 14px;
        }

        @media (max-width: 560px) {
            body {
                padding: 28px 16px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
                margin-bottom: 26px;
            }

            nav {
                width: 100%;
            }

            .task {
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <a class="brand" href="{% url 'personal_cabinet:profile' %}">Мій кабінет</a>
            <nav aria-label="Головна навігація">
                <a href="{% url 'personal_cabinet:profile' %}" {% if active_page == 'profile' %}aria-current="page"{% endif %}>Профіль</a>
                <a href="{% url 'personal_cabinet:tasks' %}" {% if active_page == 'tasks' %}aria-current="page"{% endif %}>Мої справи</a>
                <a href="{% url 'personal_cabinet:settings' %}" {% if active_page == 'settings' %}aria-current="page"{% endif %}>Налаштування</a>
            </nav>
        </header>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
