<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7f2">
    <title>Профіль користувача</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Segoe UI", sans-serif;
            color: #23332d;
            background: #f5f7f2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            background:
                radial-gradient(ellipse at 10% 5%, #e0eee2 0, transparent 34%),
                #f5f7f2;
        }

        main {
            width: min(100%, 620px);
            margin: 0 auto;
        }

        .site-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 32px;
            font-size: 0.92rem;
        }

        .site-nav a {
            color: #345b43;
            font-weight: 650;
            text-decoration: none;
        }

        .site-nav a:hover {
            text-decoration: underline;
        }

        .profile-name {
            color: #708078;
            text-align: right;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #64836f;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 7vw, 3.2rem);
            letter-spacing: -0.06em;
        }

        .intro {
            margin: 12px 0 28px;
            color: #708078;
            line-height: 1.6;
        }

        .card {
            padding: clamp(20px, 5vw, 32px);
            border: 1px solid #e6ebe4;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 18px 50px #2943310d;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 650;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dfe6de;
            border-radius: 12px;
            outline: none;
            color: inherit;
            font: inherit;
        }

        input:focus {
            border-color: #70977a;
            box-shadow: 0 0 0 3px #70977a20;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        button,
        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 16px;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            font: inherit;
            font-weight: 650;
            text-decoration: none;
            transition: background 150ms ease, transform 150ms ease;
        }

        button:hover,
        .back-link:hover {
            transform: translateY(-1px);
        }

        .save-button,
        .back-link {
            background: #345b43;
            color: #fff;
        }

        .save-button:hover,
        .back-link:hover {
            background: #284a35;
        }

        .clear-button {
            background: #f5eeeb;
            color: #8a5142;
        }

        .clear-button:hover {
            background: #f0e2dd;
        }

        .error {
            margin: 12px 0 0;
            color: #a33b2f;
            font-size: 0.9rem;
        }

        .back-link {
            margin-top: 20px;
        }

        @media (max-width: 440px) {
            body {
                padding: 32px 16px;
            }
        }
    </style>
</head>
<body>
    <main>
        <nav class="site-nav" aria-label="Головна навігація">
            <a href="{% url 'shopping_list' %}">← До списку товарів</a>
            {% if profile_name %}
                <span class="profile-name">Вітаємо, {{ profile_name }}!</span>
            {% endif %}
        </nav>
        <p class="eyebrow">Ваші налаштування</p>
        <h1>Профіль</h1>
        <p class="intro">Збережене ім'я буде відображатися на сторінках проєкту.</p>

        <section class="card" aria-label="Налаштування профілю">
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="action" value="save">
                <label for="profile-name-input">Ваше ім'я</label>
                <input
                    id="profile-name-input"
                    type="text"
                    name="name"
                    value="{{ profile_name }}"
                    placeholder="Наприклад, Олена"
                    maxlength="100"
                    required
                >
                {% if error %}
                    <p class="error" role="alert">{{ error }}</p>
                {% endif %}
                <div class="actions">
                    <button class="save-button" type="submit">Зберегти ім'я</button>
                </div>
            </form>

            {% if profile_name %}
                <form method="post" class="actions">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="clear">
                    <button class="clear-button" type="submit">Очистити ім'я</button>
                </form>
            {% endif %}
        </section>
        <a class="back-link" href="{% url 'shopping_list' %}">Перейти до товарів</a>
    </main>
</body>
</html>
